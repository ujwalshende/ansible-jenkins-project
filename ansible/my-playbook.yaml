---
- name: Install and start Docker
  hosts: tag_Name_prod_server
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present
    - name: Start docker daemon
      systemd:
        name: docker
        state: started

- name: Install Docker-compose
  hosts: tag_Name_prod_server
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory
    - name: Get architecture of remote machine
      shell: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url: 
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ remote_arch.stdout_lines[0] }}
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x  